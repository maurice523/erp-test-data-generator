# Render Blueprint: FastAPI backend (Docker) + static React frontend.
# Create both services with Render -> New -> Blueprint, pointed at this repo.
# DATABASE_URL and OPENAI_API_KEY are marked sync:false, so Render prompts for
# them on first deploy instead of storing them in the repository.

services:
  - type: web
    name: order-generator-api
    runtime: docker
    repo: https://github.com/maurice523/erp-test-data-generator
    dockerfilePath: ./backend/src/order_generator/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # The frontend calls the API through a same-origin rewrite, so no browser
      # origin needs allowing; this stays narrow for any direct calls.
      - key: ALLOWED_ORIGINS
        fromService:
          name: order-generator-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # TrustedHostMiddleware sees this service's own hostname, plus Render's
      # health checks.
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"

  - type: web
    name: order-generator-web
    runtime: static
    repo: https://github.com/maurice523/erp-test-data-generator
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Keeps the frontend's relative /api fetch working in production: the
    # browser calls the static site, Render forwards to the API service.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://order-generator-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
